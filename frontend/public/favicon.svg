<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <!-- Core HyperBERT Gradient -->
    <linearGradient id="hbGradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Subtle Specular Rim -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.2)" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="#090d16" stroke="url(#rimGrad)" stroke-width="1.2" />

  <!-- Bold Geometric "H" Transformer Glyph -->
  <!-- Left Pillar -->
  <rect x="7.5" y="7" width="4" height="18" rx="2" fill="url(#hbGradient)" />

  <!-- Right Pillar -->
  <rect x="20.5" y="7" width="4" height="18" rx="2" fill="url(#hbGradient)" />

  <!-- Central Hyperparameter Crossbar -->
  <rect x="9.5" y="14" width="13" height="4" rx="1.5" fill="url(#hbGradient)" />

  <!-- Precision Neural Focal Point -->
  <circle cx="16" cy="16" r="1.8" fill="#ffffff" />
  
  <!-- Subtle Top/Bottom Attention Nodes -->
  <circle cx="9.5" cy="8.5" r="1" fill="#a5b4fc" />
  <circle cx="22.5" cy="8.5" r="1" fill="#a5b4fc" />
  <circle cx="9.5" cy="23.5" r="1" fill="#67e8f9" />
  <circle cx="22.5" cy="23.5" r="1" fill="#67e8f9" />
</svg>
