<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="hbGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Squircle Base -->
  <rect x="1" y="1" width="30" height="30" rx="7.5" fill="#090d16" stroke="rgba(99,102,241,0.3)" stroke-width="1" />

  <!-- Same "H" glyph as NavBar (scaled from 24→32 viewBox) -->
  <!-- Left Pillar -->
  <rect x="7.5" y="6.5" width="4.5" height="19" rx="2.25" fill="url(#hbGrad)" />
  <!-- Right Pillar -->
  <rect x="20" y="6.5" width="4.5" height="19" rx="2.25" fill="url(#hbGrad)" />
  <!-- Central Crossbar -->
  <rect x="10" y="13" width="12" height="5" rx="2" fill="url(#hbGrad)" />
  <!-- Neural Focal Point -->
  <circle cx="16" cy="15.5" r="2" fill="#090d16" />
</svg>
